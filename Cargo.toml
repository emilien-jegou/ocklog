[workspace]
resolver = "2"
members = ["crates/ocklog-tasker", "crates/ocklog" ]

[workspace.dependencies]
ocklog-tasker = { path = "crates/ocklog-tasker", version = "0.1.0" }
regex = "1.13.1"
paste = "1.0.15"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
imara-diff = "0.2"
syntect = { version = "5.2" }
two-face = "0.4"
walkdir = "2.4"
tokio = { version = "1.37", features = ["full"] }
once_cell = "1.21.4"
tracing = "0.1.40"
tracing-error = "0.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "fmt", "registry"] }
clap = { version = "4.0", features = ["derive"] }
typed-builder = { version = "0.23.2" }
tracing-flame = "0.2.0"
tracing-appender = "0.2.5"
rayon = "1.12.0"
infer = "0.19.0"
arrayvec = "0.7.6"
rustc-hash = "2.1.1"
smallvec = "1.15.1"
strsim = "0.11.1"
indoc = "2.0.7"
rstest = "0.26.1"
serde = { version = "1.0", features = ["derive"] }
dirs = "5.0"
serde_json = "1.0.150"
toml = "1.1.2"
rune = { version = "0.14.2", features = ["emit", "std", "cli"] }
parking_lot = "0.12.5"
heck = "0.5.0"
eyre = "0.6.12"
async-channel = "2.5.0"
scc = "3.6.12"
libc = "0.2.186"
